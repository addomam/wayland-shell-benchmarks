<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/style.css">
  <script src="/shell.js"></script>
</head>
<body class="bar">
  <button id="launcher-button">◈ Apps</button>
  <button id="menu-button">Menu ▾</button>
  <span id="workspaces"></span>
  <span class="brand">WebShell · Vite</span>
  <span id="clock"></span>
  <script src="/bar.js"></script>
  <script type="module">
    let last = '';
    setInterval(() => {
      const color = getComputedStyle(document.body).backgroundColor;
      if (color !== last) {
        last = color;
        document.title = `css:${color}`;
      }
    }, 150);
  </script>
</body>
</html>
